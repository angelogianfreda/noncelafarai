<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life Simulation Game</title>
    <style>
        body {
            background-color: #222;
            color: #fff;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        canvas {
            background: #333;
            border: 1px solid #666;
            display: block;
            margin: 20px auto;
        }
        #controls button {
            margin: 5px;
        }
    </style>
</head>
<body>
    <h1>Simulazione di Vita 2D</h1>
    <canvas id="game" width="800" height="600"></canvas>
    <div id="controls">
        <button onclick="feed()">Dai da mangiare</button>
        <button onclick="rest()">Fai riposare</button>
    </div>
    <script src="game.js"></script>
</body>
</html>
